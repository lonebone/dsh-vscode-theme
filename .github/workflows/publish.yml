# npm Trusted Publishing (OIDC) — 自动发布 dsh-vscode-theme
#
# 完全按 npm 官方文档（docs.npmjs.com/trusted-publishers → GitHub Actions configuration）
# 的规范配置编写，仅改动触发方式（tags + 手动）和 name。
#
# 前置条件（一次性）：
#   npmjs.com → 包页面 → Package settings → Trusted Publisher → GitHub Actions：
#     Organization or user: lonebone
#     Repository: dsh-vscode-theme
#     Workflow filename: publish.yml
#     Environment: 留空
#     Allowed actions: npm publish

name: publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  id-token: write  # Required for OIDC
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false  # never use caching in release builds

      - run: npm publish  # OIDC trusted publishing; provenance auto-generated
