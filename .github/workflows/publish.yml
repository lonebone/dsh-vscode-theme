# npm 自动发布 — token 模式（经典、稳定）
#
# 前置条件（一次性）：
#   GitHub 仓库 Settings → Secrets and variables → Actions → New repository secret
#   名称: NPM_TOKEN
#   值:  你的 npm 发布 token（npm 网站 Access Tokens 里生成的那个，带 bypass 2FA + 读写权限）
#
# 触发方式：
#   git tag v0.1.1 && git push origin v0.1.1   （或 GitHub 页面手动 Run workflow）
#
# 说明：npm 官方 OIDC trusted publishing 目前有未修复的 bug（npm/cli#8730、#8976，
# 发布时签名成功但 PUT 返回 404），故使用成熟的 token 方式保证发布稳定。
# 未来 npm 修好后可切回 trusted publishing（见 PUBLISHING.md）。

name: publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
