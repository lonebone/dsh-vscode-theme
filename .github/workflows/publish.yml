# npm Trusted Publishing (OIDC) — 自动发布 dsh-vscode-theme
#
# 前置条件（一次性，见 PUBLISHING.md）：
#   npmjs.com → 包页面 → Package settings → Publishing access → Trusted Publishers
#   → Add Trusted Publisher：
#     Provider: GitHub Actions
#     Organization or user: lonebone
#     Repository name: dsh-vscode-theme
#     Workflow filename: publish.yml
#     Environment: 留空
#
# 触发方式：
#   git tag v0.1.1 && git push origin v0.1.1   （或 GitHub 页面手动 Run workflow）
#
# 安全模型：GitHub Actions 通过 OIDC 获取 npm 的短时发布凭证，仓库和 .npmrc 里
# 不需要任何长期 token / 密钥。
#
# 注意：npm 官方要求 trusted publishing 需要 npm CLI >= 11.5.1 且 Node >= 22.14，
# 因此用 node 24 并显式升级 npm 到最新。

name: publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  id-token: write   # OIDC 发布凭证必需
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Ensure npm >= 11.5.1 (trusted publishing requirement)
        run: npm install -g npm@latest

      - name: Publish to npm (trusted publishing)
        run: npm publish --provenance --access public
